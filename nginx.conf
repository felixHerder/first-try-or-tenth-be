server {
    listen 80;
    server_name ftot.felixherder.com;
    return 301 https://$host$request_uri; # Redirect to HTTPS
}

server {
    listen 443 ssl;
    server_name ftot.felixherder.com;

    ssl_certificate /etc/letsencrypt/live/ftot.felixherder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ftot.felixherder.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;

        # These headers ensure the original host and IP are preserved
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://backend:8080;

        # Crucial: Tells Spring Boot the request was originally HTTPS
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # Pass the Origin header so Spring's CORS filter can see it
        proxy_set_header Origin $http_origin;
    }
}