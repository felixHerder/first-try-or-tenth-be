server {
    listen 80;
    server_name ftot.felixherder.com;
    return 301 https://$host$request_uri; # Redirect to HTTPS
}

server {
    listen 443 ssl;
    server_name ftot.felixherder.com;

    ssl_certificate /etc/letsencrypt/live/ftot.felixherder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ftot.felixherder.com/privkey.pem;

    location / {
        proxy_pass http://frontend:80;

        # These headers ensure the original host and IP are preserved
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
    # Handle Preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://ftot.felixherder.com' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://backend:8080;

        # Crucial for CORS and Spring Security
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ensure the Origin header from the browser reaches the backend
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
    }
}